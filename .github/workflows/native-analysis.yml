name: Native static analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=":all:" capstone==5.0.3
      - run: python tools/disassemble.py
      - run: python tools/disassemble.py evidence/minimap
      - uses: actions/upload-artifact@v4
        with:
          name: native-disassembly
          path: disassembly/
          retention-days: 7
